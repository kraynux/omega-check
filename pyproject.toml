[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omega-check"
version = "1.5.0"
description = "Scanneur de ports + services + roles (cible unique), omega-check"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "kraynux", email = "kraynux@proton.me" }]
requires-python = ">=3.10"
dependencies = [
    "omega-lib>=0.1.0",
    "textual>=0.60",
    "httpx>=0.27",
    "jinja2>=3.1",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-httpserver>=1.0",
    "trustme>=1.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.0",
]

[project.scripts]
omega-check = "omega_check.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/omega_check"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_classes = []

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
disallow_untyped_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true

# Controle d'imports entre couches (voir OMEGA-CHECK_ARBORESCENCE.md §1 et
# ~/DEV/SUITE/DECISIONS_ARCHITECTURE.md D-000/D-007) : contrats copies
# verbatim depuis omega-scan/pyproject.toml, seuls les chemins de
# confinement par technologie sont adaptes a l'arborescence de CHECK.
[tool.importlinter]
root_package = "omega_check"
include_external_packages = true
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
# Ordre du plus exterieur (haut, autorise a importer tout ce qui suit) au
# plus interieur (bas, n'importe rien de la liste) :
#   app                                     -- racine de composition
#   infrastructure | interfaces | plugins   -- adaptateurs, independants entre eux
#   application                             -- cas d'usage
#   ports                                   -- contrats
#   domain                                  -- metier pur
#   core                                    -- vocabulaire transverse
name = "Dependency Rule : les couches externes dependent des internes, jamais l'inverse"
type = "layers"
layers = [
    "omega_check.app",
    "omega_check.infrastructure | omega_check.interfaces | omega_check.plugins",
    "omega_check.application",
    "omega_check.ports",
    "omega_check.domain",
    "omega_check.core",
]

[[tool.importlinter.contracts]]
name = "interfaces ne dependent jamais directement de infrastructure"
type = "independence"
modules = [
    "omega_check.interfaces",
    "omega_check.infrastructure",
]

[[tool.importlinter.contracts]]
name = "textual seulement dans interfaces.tui"
type = "forbidden"
source_modules = [
    "omega_check.core",
    "omega_check.domain",
    "omega_check.application",
    "omega_check.ports",
    "omega_check.infrastructure",
    "omega_check.plugins",
    "omega_check.shared",
    "omega_check.app",
    "omega_check.interfaces.cli",
]
forbidden_modules = ["textual"]

[[tool.importlinter.contracts]]
# app/ est volontairement absente de source_modules : c'est la racine de
# composition (app/dependency_container.py doit pouvoir construire un
# SqliteScanRepository) — verifie au niveau du module qui importe sqlite3
# lui-meme, pas de tout module qui construit une instance qui l'importe.
name = "sqlite3 seulement dans infrastructure.storage.sqlite"
type = "forbidden"
source_modules = [
    "omega_check.core",
    "omega_check.domain",
    "omega_check.application",
    "omega_check.ports",
    "omega_check.interfaces",
    "omega_check.plugins",
    "omega_check.shared",
]
forbidden_modules = ["sqlite3"]

[[tool.importlinter.contracts]]
name = "httpx seulement dans infrastructure.network"
type = "forbidden"
source_modules = [
    "omega_check.core",
    "omega_check.domain",
    "omega_check.application",
    "omega_check.ports",
    "omega_check.interfaces",
    "omega_check.plugins",
    "omega_check.shared",
]
forbidden_modules = ["httpx"]

[[tool.importlinter.contracts]]
name = "jinja2 seulement dans infrastructure.exporters.html_exporter"
type = "forbidden"
source_modules = [
    "omega_check.core",
    "omega_check.domain",
    "omega_check.application",
    "omega_check.ports",
    "omega_check.interfaces",
    "omega_check.plugins",
    "omega_check.shared",
    "omega_check.infrastructure.config",
    "omega_check.infrastructure.exceptions",
    "omega_check.infrastructure.logging",
    "omega_check.infrastructure.network",
    "omega_check.infrastructure.storage",
    "omega_check.infrastructure.exporters.json_exporter",
    "omega_check.infrastructure.exporters.text_exporter",
]
forbidden_modules = ["jinja2"]
